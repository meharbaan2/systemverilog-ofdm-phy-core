<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img" aria-label="Sample OFDM waveform">
  <rect width="980" height="300" fill="#f8fafc"/>
  <style>
    .title{font:700 22px Arial,sans-serif;fill:#0f172a}
    .small{font:13px Arial,sans-serif;fill:#334155}
    .axis{stroke:#64748b;stroke-width:1}
    .re{fill:none;stroke:#2563eb;stroke-width:3}
    .im{fill:none;stroke:#059669;stroke-width:3}
    .cp{fill:#e0f2fe;opacity:.7}
  </style>
  <text x="30" y="36" class="title">Generated OFDM CP Waveform Example</text>
  <text x="30" y="60" class="small">Illustrative fixed-point output shape from an 80-sample frame: 16 CP samples followed by 64 useful samples.</text>
