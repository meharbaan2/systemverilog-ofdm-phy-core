  <path class="im" d="M70 178 L92 210 L114 184 L136 122 L158 140 L180 214 L202 222 L224 166 L246 118 L268 150 L290 220 L312 202 L334 132 L356 116 L378 174 L400 226 L422 194 L444 126 L466 138 L488 208 L510 218 L532 160 L554 112 L576 154 L598 224 L620 198 L642 128 L664 120 L686 178 L708 226 L730 188 L752 122 L774 142 L796 214 L818 216 L840 158 L862 116 L884 156 L906 220 L928 190"/>
  <text x="110" y="276" class="small">CP</text>
